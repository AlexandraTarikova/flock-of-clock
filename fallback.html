<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            height: 90vh;
            width: 90vw;
            font-family: Arial, sans-serif;
            padding: 5vh 5vw;
            margin: 0;
        }
        
        .clock {
            width: 100%;
            height: 100%;
            border: 0.5vmin solid #333;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }
        
        .clock-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 5vmin;
            font-weight: bold;
        }
        
        .number span {
            display: inline-block;
            margin-top: 10px;
        }
        
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
        }
        
        .hour-hand {
            width: 8px;
            height: 16%;
            background: #333;
            margin-left: -4px;
            transform: rotate(249deg); /* 8 hours + 19 minutes (each minute = 0.5 degrees) */
        }
        
        .minute-hand {
            width: 6px;
            height: 25%;
            background: #666;
            margin-left: -3px;
            transform: rotate(114deg); /* 19 minutes */
        }
        
        .second-hand {
            width: 2px;
            height: 32%;
            background: red;
            margin-left: -1px;
            transform: rotate(0deg);
            animation: rotate 6s steps(12, jump-end) infinite;
        }
        
        .center {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Position numbers */
        .number1 { transform: rotate(30deg); 
        animation: number1 6s steps(1, jump-end) 0.5s infinite }
        .number1 span { transform: rotate(-30deg); }
        
        .number2 { transform: rotate(60deg);
        animation: number1 6s steps(1, jump-end) 1s infinite }
        .number2 span { transform: rotate(-60deg); }
        
        .number3 { transform: rotate(90deg);
        animation: number1 6s steps(1, jump-end) 1.5s infinite }
        .number3 span { transform: rotate(-90deg); }
        
        .number4 { transform: rotate(120deg);
        animation: number1 6s steps(1, jump-end) 2s infinite }
        .number4 span { transform: rotate(-120deg); }
        
        .number5 { transform: rotate(150deg);
        animation: number1 6s steps(1, jump-end) 2.5s infinite }
        .number5 span { transform: rotate(-150deg); }
        
        .number6 { transform: rotate(180deg);
        animation: number1 6s steps(1, jump-end) 3s infinite }
        .number6 span { transform: rotate(-180deg); }
        
        .number7 { transform: rotate(210deg);
        animation: number1 6s steps(1, jump-end) 3.5s infinite }
        .number7 span { transform: rotate(-210deg); }
        
        .number8 { transform: rotate(240deg);
        animation: number1 6s steps(1, jump-end) 4s infinite }
        .number8 span { transform: rotate(-240deg); }
        
        .number9 { transform: rotate(270deg);
        animation: number1 6s steps(1, jump-end) 4.5s infinite }
        .number9 span { transform: rotate(-270deg); }
        
        .number10 { transform: rotate(300deg);
        animation: number1 6s steps(1, jump-end) 5s infinite }
        .number10 span { transform: rotate(-300deg); }
        
        .number11 { transform: rotate(330deg);
        animation: number1 6s steps(1, jump-end) 5.5s infinite }
        .number11 span { transform: rotate(-330deg); }
        
        .number12 { transform: rotate(0deg);
        animation: number1 6s steps(1, jump-end) 6s infinite }
        .number12 span { transform: rotate(0deg); }
        
        .letter1 { opacity: 0; color: #A94747;
        animation: letter1 6s steps(1, jump-end) 0.5s infinite }
        .letter2 { opacity: 0;  color: #A85F32;
        animation: letter1 6s steps(1, jump-end) 1s infinite }
        .letter3 { opacity: 0; color: #96731F;
        animation: letter1 6s steps(1, jump-end) 1.5s infinite }
        .letter4 { opacity: 0; color: #6F7D32;
        animation: letter1 6s steps(1, jump-end) 2s infinite }
        .letter5 { opacity: 0; color: #3F7F4E;
        animation: letter1 6s steps(1, jump-end) 2.5s infinite }
        .letter6 { opacity: 0; color: #287A70;
        animation: letter1 6s steps(1, jump-end) 3s infinite }
        .letter7 { opacity: 0; color: #39758D;
        animation: letter1 6s steps(1, jump-end) 3.5s infinite }
        .letter8 { opacity: 0; color: #526E9B;
        animation: letter1 6s steps(1, jump-end) 4s infinite }
        .letter9 { opacity: 0; color: #685F9B;
        animation: letter1 6s steps(1, jump-end) 4.5s infinite }
        .letter10 { opacity: 0; color: #81588F;
        animation: letter1 6s steps(1, jump-end) 5s infinite }
        .letter11 { opacity: 0; color: #985174;
        animation: letter1 6s steps(1, jump-end) 5.5s infinite }
        .letter12 { opacity: 0; color: #A64D5B;
        animation: letter1 6s steps(1, jump-end) 6s infinite }
        
        .letter1, .letter2, .letter3, .letter4, .letter5, .letter6, .letter7, .letter8, .letter9, .letter10, .letter11, .letter12 { font-size: 5vmin;}
        
        
        @keyframes number1 {
            0% {
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
        }
        
        @keyframes letter1 {
            0% {
                opacity: 1;
            }
            8% {
                opacity: 0;
            }
        }
        
        
    </style>
</head>
<body>
    <div class="clock">
        <div class="clock-face">
            
            <div class="number number1 letter1"><span>b</span></div>
            <div class="number number2 letter2"><span>o</span></div>
            <div class="number number3 letter3"><span>o</span></div>
            <div class="number number4 letter4"><span>p</span></div>
            <div class="number number5 letter5"><span>b</span></div>
            <div class="number number6 letter6"><span>o</span></div>
            <div class="number number7 letter7"><span>o</span></div>
            <div class="number number8 letter8"><span>p</span></div>
            <div class="number number9 letter9"><span>b</span></div>
            <div class="number number10 letter10"><span>o</span></div>
            <div class="number number11 letter11"><span>o</span></div>
            <div class="number number12 letter12"><span>p</span></div>
            
            <div class="number number1"><span>1</span></div>
            <div class="number number2"><span>2</span></div>
            <div class="number number3"><span>3</span></div>
            <div class="number number4"><span>4</span></div>
            <div class="number number5"><span>5</span></div>
            <div class="number number6"><span>6</span></div>
            <div class="number number7"><span>7</span></div>
            <div class="number number8"><span>8</span></div>
            <div class="number number9"><span>9</span></div>
            <div class="number number10"><span>10</span></div>
            <div class="number number11"><span>11</span></div>
            <div class="number number12"><span>12</span></div>
            
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="center"></div>
        </div>
    </div>
</body>
</html>
